#:schema https://mise.en.dev/schema/mise.json

[hooks]
enter = [
  { shell = "bash", script = "command -v hum >/dev/null && source <(hum completion bash)" },
  { shell = "zsh", script = "command -v hum >/dev/null && source <(hum completion zsh)" },
  { shell = "fish", script = "type -q hum; and hum completion fish | source" },
]

[tool_alias]
varlock = "github:dmno-dev/varlock"

[tools]
bun = "latest"
varlock = { version = "latest", version_prefix = "varlock@" }
prettier = "latest"
gitleaks = "latest"
jq = "latest"
lefthook = "latest"
task = "latest"
uv = "latest"
"github:brettinternet/hum" = "latest"

# Backlog.md is the committed work queue the CAO pattern in cao/ drives. Pinned
# because cao/scripts/tracker.sh depends on its `--json` task/list shapes.
"github:MrLesk/Backlog.md" = { version = "1.49.3", bin = "backlog" }

[settings]
disable_backends = ["asdf"]
npm.bun = true
