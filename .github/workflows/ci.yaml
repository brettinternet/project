---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Server Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      # FIXME:
      - name: Setup language
        run: echo "Setup language here"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-dev-

      # FIXME:
      - name: Install dependencies
        run: task server:setup-ci

      - name: Build
        run: task server:build

      - name: Run checks
        run: task server:check

      # - name: Cache build artifacts
      #   uses: actions/cache/save@v4
      #   with:
      #     path: |
      #       deps
      #       _build
      #     key: ${{ runner.os }}-mix-build-dev-${{ github.sha }}

  server-test:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Server Tests
    runs-on: ubuntu-latest
    needs: server-checks

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test

    steps:
      - uses: actions/checkout@v4

      # FIXME:
      - name: Setup language
        run: echo "Setup language here"

      # - name: Restore build artifacts
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: |
      #       deps
      #       _build
      #     key: ${{ runner.os }}-mix-build-dev-${{ github.sha }}
      #     fail-on-cache-miss: true

      - name: Run tests
        run: task server:test

  client:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Client CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: task client:setup-ci

      - name: Build
        run: task client:build
        working-directory: client

      - name: Run Biome checks
        run: task client:check
        working-directory: client

      - name: Run Biome tests
        run: task client:test
        working-directory: client
