---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Server Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: task server:setup-ci

      - name: Run checks
        run: task server:check

  server-test:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Server Tests
    runs-on: ubuntu-latest
    needs: server-checks

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: task server:setup-ci

      - name: Run tests
        run: task server:test

  client:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    name: Client CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('client/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: task client:setup-ci

      - name: Run client checks
        run: task client:check

      - name: Run client tests
        run: task client:test
