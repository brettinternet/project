---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Install dependencies
    cmds:
      - task: mise
      - task: env:init
      - task: lefthook

  mise:
    desc: Install workstation dependencies
    cmds:
      - mise trust -q -a
      - mise install -q
    preconditions:
      - sh: command -v mise
        msg: Mise is not installed

  worktree:
    desc: Prepare a checkout without starting or changing any stack
    cmds:
      - task: env:init
      - task: :client:setup
      - task: lefthook

  env:init:
    desc: Create local overrides and a stable worktree identity, then validate
    cmds:
      - mise exec bun -- bun scripts/worktree-env.ts
      - task: env:check

  env:check:
    desc: Validate and resolve the Varlock environment
    cmd: '{{.ENV_RUN}} -- bun -e ''console.log("Environment valid")'''

  env:encrypt:
    desc: Encrypt one value for use in .env.local
    cmd: mise exec varlock -- varlock encrypt

  env:run:
    desc: Run a command with scoped Varlock environment values
    cmd: "{{.ENV_RUN}} -- {{.CLI_ARGS}}"

  env:lock:
    desc: Lock the Varlock local encryption session
    cmd: mise exec varlock -- varlock lock

  lefthook:
    desc: Install Lefthook
    cmds:
      - lefthook install
    preconditions:
      - command -v lefthook
      - test -f lefthook.yaml
