project_name: "Project"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels:
  # Lane labels: which area of the repository the task belongs to.
  - client
  - server
  - infra
  - docs
  - loop
  # Gate labels: only the owner can finish these.
  - human
  - device
  - credential
  # Only an oracle-confirmed external prerequisite may set blocked.
  - blocked
  # A workflow exhausted its attempt budget or hit an owner-only question.
  - escalated
  # A parent task that exists only to hold children; never dispatched.
  - container
  # Authorizes a task to modify a protected gate file.
  - tooling
  # Deliberately postponed by the owner.
  - deferred
definition_of_done:
  - "task ci passes on the final commit"
  - "Every checked acceptance criterion has an AC#N evidence line in Implementation Notes naming the command and its result"
  - "An independent verifier pass returned PASS for every acceptance criterion"
  - "The diff touches only the paths declared in the task's modified-file list, or the deviation is justified in Implementation Notes"
  - "No test was deleted, skipped, or weakened"
  - "No protected gate file was modified unless the owner labelled this task tooling"
  - "Committed on main with the task ID in the commit subject and a Task: trailer"
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "code --wait"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "TASK"
