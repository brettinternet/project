---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # Varlock normally gives ambient env priority. Drop routing/identity inherited
  # from another checkout; local files are authoritative for these values.
  ENV_RUN: >-
    env -u DOMAIN -u COMPOSE_PROJECT_NAME -u APP_PORT -u TRAEFIK_PORT -u POSTGRES_PORT
    COMPOSE_DISABLE_ENV_FILE=1 mise exec varlock -- varlock run
    -p "{{.ROOT_DIR}}/.env.schema" -p "{{.ROOT_DIR}}/.env.local"
    -p "{{.ROOT_DIR}}/.env.worktree.local"

includes:
  setup: .taskfiles/setup.yaml
  server: .taskfiles/server.yaml
  client:
    dir: client
    taskfile: .taskfiles/client.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install dependencies and setup environment
    aliases: [setup]
    deps:
      - task: setup:init
    cmds:
      - task: server:init
      - task: client:init

  check:
    desc: Run all project checks
    deps:
      - task: server:check
      - task: client:check
    cmds:
      - mise exec prettier -- prettier --check .

  check:staged:
    desc: Run checks only for staged files
    aliases: [check-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit

  fix:
    desc: Fix all project files
    deps:
      - task: server:fix
      - task: client:fix
    cmds:
      - mise exec prettier -- prettier --write .

  test:
    desc: Run all tests
    deps:
      - task: server:test
      - task: client:test
    cmds:
      - task: test:worktree

  test:worktree:
    desc: Verify worktree setup, readiness, and port isolation
    cmd: mise exec bun -- bun test scripts

  app:start:
    desc: Run the example application (normally started by Hum)
    cmd: >-
      {{.ENV_RUN}} -- bun scripts/dev-server.ts

  app:ready:
    desc: Probe this checkout's example application
    cmd: >-
      {{.ENV_RUN}} -- bun -e 'const response = await fetch(`http://127.0.0.1:${process.env.APP_PORT}/readyz`,
      { signal: AbortSignal.timeout(2000) }); process.exit(response.ok ? 0 : 1)'

  compose:up:
    aliases: [up]
    desc: Start all services
    deps:
      - server:compose:services
    cmds:
      - task: server:compose:up
      - task: client:compose:up

  compose:services:
    aliases: [compose:services:up]
    desc: Start services
    deps:
      - server:compose:services

  compose:services:down:
    desc: Down services
    deps:
      - server:compose:services:down

  compose:down:
    aliases: [down]
    desc: Down services
    deps:
      - server:compose:services:down
      - server:compose:down
      - client:compose:down
