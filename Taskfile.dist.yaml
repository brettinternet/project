---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  setup: .taskfiles/setup.yaml
  server: .taskfiles/server.yaml
  client:
    dir: client
    taskfile: .taskfiles/client.yaml
  cao:
    dir: cao
    taskfile: cao/Taskfile.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install dependencies and setup environment
    aliases: [setup]
    deps:
      - task: setup:init
    cmds:
      - task: server:init
      - task: client:init

  ci:
    desc: The gate. Everything that must pass before a backlog task is Done.
    cmds:
      - task: check
      - task: test

  backlog:
    desc: Show the committed Backlog.md work queue
    cmd: ./cao/scripts/tracker.sh list --plain

  standup:
    desc: Autonomous loop work and owner needs
    silent: true
    cmds:
      - 'echo "-- committed since yesterday --"'
      - git log --oneline --since=yesterday main || true
      - 'echo "-- done --"'
      - ./cao/scripts/tracker.sh list --status Done --plain || true
      - 'echo "-- in progress --"'
      - ./cao/scripts/tracker.sh list --status "In Progress" --plain || true
      - 'echo "-- blocked: an external change is required --"'
      - ./cao/scripts/tracker.sh list -l blocked --plain || true
      - 'echo "-- needs you: only the owner can finish these --"'
      - ./cao/scripts/tracker.sh list -l human --plain || true
      - 'echo "-- escalated: a workflow gave up, you decide --"'
      - ./cao/scripts/tracker.sh list -l escalated --plain || true
      - 'echo "-- gate --"'
      - |
        task ci >/dev/null 2>&1 && echo "gate: green" || echo "gate: RED"

  check:
    desc: Run all project checks
    deps:
      - task: server:check
      - task: client:check
      - task: cao:check
    cmds:
      - mise exec prettier -- prettier --check .

  check:staged:
    desc: Run checks only for staged files
    aliases: [check-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit

  fix:
    desc: Fix all project files
    deps:
      - task: server:fix
      - task: client:fix
    cmds:
      - mise exec prettier -- prettier --write .

  test:
    desc: Run all tests
    deps:
      - task: server:test
      - task: client:test
      - task: cao:test

  compose:up:
    aliases: [up]
    desc: Start all services
    deps:
      - server:compose:services
    cmds:
      - task: server:compose:up
      - task: client:compose:up

  compose:services:
    aliases: [compose:services:up]
    desc: Start services
    deps:
      - server:compose:services

  compose:services:down:
    desc: Down services
    deps:
      - server:compose:services:down

  compose:down:
    aliases: [down]
    desc: Down services
    deps:
      - server:compose:services:down
      - server:compose:down
      - client:compose:down
